name: Host software regression
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host-test dependencies (not a hardware test)
        run: python -m pip install -r requirements-host-tests.txt
      - name: Verify mandatory CAD dependencies (no silent SKIP)
        run: python -c "import pytest, numpy, trimesh, cadquery, ezdxf; print('CAD/test imports: PASS')"
      - name: Run host tests
        run: python tools/run_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-test-evidence
          path: |
            results/test_report.json
            results/PASS_FAIL_LOG.txt
            results/junit.xml
